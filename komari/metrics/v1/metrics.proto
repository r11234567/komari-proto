syntax = "proto3";

package komari.metrics.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/r11234567/komari-proto/gen/go/komari/metrics/v1;metricsv1";

// MetricsService owns metric ingest, bounded queries, and live subscriptions.
service MetricsService {
  // SubmitMetrics stores one idempotent batch.
  rpc SubmitMetrics(SubmitMetricsRequest) returns (SubmitMetricsResponse);
  // UploadMetrics stores a bounded client stream without sharing other lifecycles.
  rpc UploadMetrics(stream UploadMetricsRequest) returns (UploadMetricsResponse);
  // StreamMetrics continuously uploads sequenced batches and acknowledges each batch.
  rpc StreamMetrics(stream StreamMetricsRequest) returns (stream StreamMetricsResponse);
  // QueryMetrics retrieves a bounded time window.
  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse);
  // ListMetricDefinitions returns the public metric catalog used by themes.
  rpc ListMetricDefinitions(ListMetricDefinitionsRequest) returns (ListMetricDefinitionsResponse);
  // ListPingTasks returns public latency targets without their secret addresses.
  rpc ListPingTasks(ListPingTasksRequest) returns (ListPingTasksResponse);
  // GetPingStats returns bounded server-computed latency statistics.
  rpc GetPingStats(GetPingStatsRequest) returns (GetPingStatsResponse);
  // WatchMetrics streams live samples until cancellation or deadline.
  rpc WatchMetrics(WatchMetricsRequest) returns (stream WatchMetricsResponse);
  // UpdateMetricDefinition changes administrator-controlled retention.
  rpc UpdateMetricDefinition(UpdateMetricDefinitionRequest) returns (UpdateMetricDefinitionResponse);
  rpc GetDownsamplingPolicy(GetDownsamplingPolicyRequest) returns (GetDownsamplingPolicyResponse);
  rpc SetDownsamplingPolicy(SetDownsamplingPolicyRequest) returns (SetDownsamplingPolicyResponse);
  rpc GetMetricMigrationStatus(GetMetricMigrationStatusRequest) returns (GetMetricMigrationStatusResponse);
  rpc StartMetricMigration(StartMetricMigrationRequest) returns (StartMetricMigrationResponse);
  rpc CancelMetricMigration(CancelMetricMigrationRequest) returns (CancelMetricMigrationResponse);
}

// MetricsPoint is one typed metric sample.
message MetricsPoint {
  string metric = 1;
  double value = 2;
  google.protobuf.Timestamp observed_at = 3;
  map<string, string> labels = 4;
}

// SubmitMetricsRequest contains one sequenced metric batch.
message SubmitMetricsRequest {
  string agent_id = 1;
  uint64 sequence = 2;
  repeated MetricsPoint points = 3;
}

// SubmitMetricsResponse acknowledges one batch.
message SubmitMetricsResponse {
  uint64 accepted_sequence = 1;
  uint32 accepted_points = 2;
}

// UploadMetricsRequest is one batch in a bounded upload stream.
message UploadMetricsRequest {
  SubmitMetricsRequest batch = 1;
}

// UploadMetricsResponse acknowledges the complete upload stream.
message UploadMetricsResponse {
  uint64 accepted_sequence = 1;
  uint64 accepted_points = 2;
}

// StreamMetricsRequest wraps one sequenced batch on the long-lived upload stream.
message StreamMetricsRequest {
  SubmitMetricsRequest batch = 1;
}

// StreamMetricsResponse acknowledges one committed batch before the next is sent.
message StreamMetricsResponse {
  uint64 accepted_sequence = 1;
  uint32 accepted_points = 2;
}

// QueryMetricsRequest describes a bounded metrics query.
message QueryMetricsRequest {
  repeated string agent_ids = 1;
  repeated string metrics = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  uint32 max_points = 5;
  map<string, string> tags = 6;
  optional bool downsample = 7;
  string aggregation = 8;
  bool fill_empty = 9;
}

// QueryMetricsResponse contains grouped metric series.
message QueryMetricsResponse {
  repeated MetricsSeries series = 1;
}

// MetricsSeries groups ordered points for one agent and metric.
message MetricsSeries {
  string agent_id = 1;
  string metric = 2;
  map<string, string> labels = 3;
  repeated MetricsPoint points = 4;
  repeated QueryPoint query_points = 5;
  string type = 6;
  string unit = 7;
  uint32 retention_days = 8;
  bool downsampled = 9;
  string aggregation = 10;
  google.protobuf.Duration interval = 11;
}

// QueryPoint is one historical bucket. Missing value distinguishes an empty bucket from zero.
message QueryPoint {
  google.protobuf.Timestamp observed_at = 1;
  optional double value = 2;
  uint32 sample_count = 3;
  map<string, string> labels = 4;
}

// ListMetricDefinitionsRequest is intentionally empty.
message ListMetricDefinitionsRequest {}

message ListMetricDefinitionsResponse {
  repeated MetricDefinition definitions = 1;
}

message MetricDefinition {
  string name = 1;
  string description = 2;
  string type = 3;
  string unit = 4;
  uint32 retention_days = 5;
  map<string, string> metadata = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// ListPingTasksRequest is intentionally empty.
message ListPingTasksRequest {}

message ListPingTasksResponse {
  repeated PingTask tasks = 1;
}

message PingTask {
  uint64 task_id = 1;
  string name = 2;
  string type = 3;
  google.protobuf.Duration interval = 4;
}

message GetPingStatsRequest {
  repeated string agent_ids = 1;
  repeated uint64 task_ids = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  uint32 max_points = 5;
}

message GetPingStatsResponse {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  google.protobuf.Duration interval = 3;
  repeated PingStat stats = 4;
}

message PingStat {
  string agent_id = 1;
  uint64 task_id = 2;
  string name = 3;
  string type = 4;
  google.protobuf.Duration probe_interval = 5;
  map<string, string> tags = 6;
  uint32 total = 7;
  uint32 valid = 8;
  double loss_percent = 9;
  bool loss_approximate = 10;
  optional double minimum = 11;
  optional double maximum = 12;
  optional double average = 13;
  optional double latest = 14;
  optional double p50 = 15;
  optional double p99 = 16;
  optional double standard_deviation = 17;
  double p99_p50_ratio = 18;
}

// WatchMetricsRequest subscribes to current samples with a server-enforced interval.
message WatchMetricsRequest {
  repeated string agent_ids = 1;
  repeated string metrics = 2;
  google.protobuf.Duration minimum_interval = 3;
}

// WatchMetricsResponse wraps one live sample.
message WatchMetricsResponse {
  MetricsPoint point = 1;
  string agent_id = 2;
}

message UpdateMetricDefinitionRequest {
  string name = 1;
  uint32 retention_days = 2;
}

message UpdateMetricDefinitionResponse {
  MetricDefinition definition = 1;
}

message GetDownsamplingPolicyRequest {}

message GetDownsamplingPolicyResponse {
  DownsamplingPolicy policy = 1;
}

message SetDownsamplingPolicyRequest {
  bool enabled = 1;
  uint32 minute_retention_minutes = 2;
  uint32 five_minute_retention_minutes = 3;
  uint32 hour_retention_hours = 4;
}

message SetDownsamplingPolicyResponse {
  DownsamplingPolicy policy = 1;
}

message DownsamplingPolicy {
  bool enabled = 1;
  bool preserve_raw = 2;
  string raw_retention = 3;
  uint32 minute_retention_minutes = 4;
  uint32 five_minute_retention_minutes = 5;
  uint32 hour_retention_hours = 6;
  repeated DownsamplingTier tiers = 7;
}

message DownsamplingTier {
  string interval = 1;
  string retention = 2;
}

message GetMetricMigrationStatusRequest {}

message GetMetricMigrationStatusResponse {
  MetricMigration migration = 1;
}

message StartMetricMigrationRequest {
  string source_driver = 1;
  string source_dsn = 2;
}

message StartMetricMigrationResponse {
  MetricMigration migration = 1;
}

message CancelMetricMigrationRequest {}

message CancelMetricMigrationResponse {
  MetricMigration migration = 1;
}

message MetricMigration {
  MetricMigrationState state = 1;
  bool is_running = 2;
  string source_driver = 3;
  string source_dsn = 4;
  string target_driver = 5;
  string target_dsn = 6;
  uint32 total_metrics = 7;
  uint32 metrics_done = 8;
  string current_metric = 9;
  uint64 migrated_points = 10;
  optional google.protobuf.Timestamp started_at = 11;
  optional google.protobuf.Timestamp finished_at = 12;
  string error = 13;
}

enum MetricMigrationState {
  METRIC_MIGRATION_STATE_UNSPECIFIED = 0;
  METRIC_MIGRATION_STATE_IDLE = 1;
  METRIC_MIGRATION_STATE_RUNNING = 2;
  METRIC_MIGRATION_STATE_COMPLETED = 3;
  METRIC_MIGRATION_STATE_FAILED = 4;
  METRIC_MIGRATION_STATE_CANCELED = 5;
}
