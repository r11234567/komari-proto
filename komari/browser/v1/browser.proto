syntax = "proto3";

package komari.browser.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "komari/common/v1/common.proto";
import "komari/report/v1/report.proto";

option go_package = "github.com/r11234567/komari-proto/gen/go/komari/browser/v1;browserv1";

// BrowserService owns typed browser-facing read models and theme compatibility metadata.
service BrowserService {
  // GetPublicInfo returns public site metadata.
  rpc GetPublicInfo(GetPublicInfoRequest) returns (GetPublicInfoResponse);
  // ListAgents returns a bounded typed node list.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // GetAgent returns one typed node detail.
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
  // WatchAgentStatus streams status changes until AbortSignal/deadline cancellation.
  rpc WatchAgentStatus(WatchAgentStatusRequest) returns (stream WatchAgentStatusResponse);
  // GetSession reports the calling visitor's own login state.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // GetThemeContract returns the stable third-party theme integration contract.
  rpc GetThemeContract(GetThemeContractRequest) returns (GetThemeContractResponse);
  // GetTrafficTrend returns an administrator-only rolling traffic trend.
  rpc GetTrafficTrend(GetTrafficTrendRequest) returns (GetTrafficTrendResponse);
}

// GetPublicInfoRequest is intentionally empty.
message GetPublicInfoRequest {}

// GetPublicInfoResponse contains public site metadata.
message GetPublicInfoResponse {
  string site_name = 1;
  string site_description = 2;
  string version = 3;
  string default_theme = 4;
  bool cors_origin_check_enabled = 5;
  string custom_body = 6;
  string custom_head = 7;
  bool disable_password_login = 8;
  string oauth_provider = 9;
  bool oauth_enabled = 10;
  uint32 metric_retention_days = 11;
  bool private_site = 12;
  google.protobuf.Struct theme_settings = 13;
  bool visitor_audit_enabled = 14;
  string build_hash = 15;
}

// ListAgentsRequest contains bounded filters and pagination.
message ListAgentsRequest {
  komari.common.v1.PageRequest page = 1;
  repeated string agent_ids = 2;
  string search = 3;
}

// ListAgentsResponse contains typed agent summaries.
message ListAgentsResponse {
  repeated AgentSummary agents = 1;
  komari.common.v1.PageResponse page = 2;
}

// GetAgentRequest identifies one agent.
message GetAgentRequest {
  string agent_id = 1;
}

// GetAgentResponse contains current report data.
message GetAgentResponse {
  AgentSummary agent = 1;
  komari.report.v1.AgentReport latest_report = 2;
}

// WatchAgentStatusRequest resumes after a browser event ID.
message WatchAgentStatusRequest {
  repeated string agent_ids = 1;
  string after_event_id = 2;
}

// WatchAgentStatusResponse wraps one changed agent summary.
message WatchAgentStatusResponse {
  AgentSummary agent = 1;
  komari.report.v1.AgentReport latest_report = 2;
}

// AgentSummary is the stable browser node list representation.
message AgentSummary {
  string agent_id = 1;
  string name = 2;
  AgentStatus status = 3;
  google.protobuf.Timestamp last_seen = 4;
  double cpu_percent = 5;
  double memory_percent = 6;
  string event_id = 7;
  komari.report.v1.AgentCapabilities capabilities = 8;
  AgentBasicInfo basic_info = 9;
}

// AgentBasicInfo is the stable non-secret browser node model.
message AgentBasicInfo {
  string cpu_name = 1;
  string virtualization = 2;
  string architecture = 3;
  uint32 cpu_cores = 4;
  string os = 5;
  string kernel_version = 6;
  string gpu_name = 7;
  string region = 8;
  uint64 memory_total_bytes = 9;
  uint64 swap_total_bytes = 10;
  uint64 disk_total_bytes = 11;
  string agent_version = 12;
  int32 weight = 13;
  double price = 14;
  string tags = 15;
  uint32 billing_cycle_days = 16;
  string currency = 17;
  string group = 18;
  uint64 traffic_limit_bytes = 19;
  string traffic_limit_type = 20;
  google.protobuf.Timestamp expires_at = 21;
  google.protobuf.Timestamp created_at = 22;
  google.protobuf.Timestamp updated_at = 23;
  string ipv4 = 24;
  string ipv6 = 25;
  // public_remark is the operator-authored note shown on the public dashboard.
  string public_remark = 26;
  bool auto_renewal = 27;
  // billing_cycle_days is unsigned and cannot carry the one-time billing that
  // the data model encodes as a negative cycle: that value gets clamped to
  // zero, which is indistinguishable from "not configured". Publish it as its
  // own flag so themes can tell the two apart.
  bool billing_one_time = 28;
}

// GetSessionRequest is intentionally empty; the session is read from the request.
message GetSessionRequest {}

// GetSessionResponse describes the calling visitor. A theme uses it to decide
// between offering a login prompt and linking straight to the admin console,
// so it stays answerable by guests and never carries credentials.
message GetSessionResponse {
  bool logged_in = 1;
  string user_id = 2;
  string username = 3;
  bool two_factor_enabled = 4;
  string sso_provider = 5;
  string language = 6;
  string color = 7;
}

// GetThemeContractRequest is intentionally empty.
message GetThemeContractRequest {}

// GetThemeContractResponse describes the stable theme schema and RPC migration.
message GetThemeContractResponse {
  uint32 schema_version = 1;
  string manifest_name = 2;
  string connect_base_path = 3;
  bool legacy_json_rpc_available = 4;
}

// GetTrafficTrendRequest selects a rolling window and bucket interval. Empty
// values default to 24 hours and 15 minutes respectively.
message GetTrafficTrendRequest {
  google.protobuf.Duration window = 1;
  google.protobuf.Duration interval = 2;
}

// GetTrafficTrendResponse contains non-cumulative upload and download buckets.
message GetTrafficTrendResponse {
  repeated TrafficTrendBucket buckets = 1;
  google.protobuf.Duration interval = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// TrafficTrendBucket covers [start_time, start_time + interval).
message TrafficTrendBucket {
  google.protobuf.Timestamp start_time = 1;
  uint64 upload_bytes = 2;
  uint64 download_bytes = 3;
}

// AgentStatus is the coarse online state for browser lists.
enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_ONLINE = 1;
  AGENT_STATUS_OFFLINE = 2;
}
