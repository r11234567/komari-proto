syntax = "proto3";

package komari.security.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/r11234567/komari-proto/gen/go/komari/security/v1;securityv1";

// SignedEnvelope carries an authenticated instruction from the control plane
// to one agent.
//
// Transport confidentiality is TLS's job, and Go's TLS stack already performs
// a hybrid post-quantum key exchange by default. What TLS cannot provide is
// end-to-end authenticity when it terminates before the control plane: a
// reverse proxy or access gateway sees plaintext and could forge an
// instruction. This envelope closes exactly that gap, so it signs rather than
// re-encrypts.
message SignedEnvelope {
  // payload is the canonical serialization of the signed instruction. It is
  // opaque here so the signature covers exact bytes rather than a re-encoding.
  bytes payload = 1;
  // signatures holds one or more independent signatures over the same payload.
  // It is repeated rather than singular so a signature algorithm can be
  // migrated by dual-signing: agents that understand only the old algorithm
  // keep verifying while newer agents verify the replacement.
  repeated Signature signatures = 2;
}

// SignedInstruction is the payload bytes of a SignedEnvelope.
//
// Every field is covered by the signature. The replay defenses are part of the
// signed content rather than transport metadata, because a signature that does
// not bind the target and a deadline can be replayed against another agent or
// at another time.
message SignedInstruction {
  // agent_id binds the instruction to one agent, so a captured envelope
  // cannot be replayed against a different host.
  string agent_id = 1;
  // nonce is single-use. An agent rejects a nonce it has already accepted.
  string nonce = 2;
  google.protobuf.Timestamp issued_at = 3;
  // expires_at bounds how long a captured envelope stays useful.
  google.protobuf.Timestamp expires_at = 4;
  // instruction_type names what is being authorized, so a signature minted for
  // one operation cannot be presented as authorization for another.
  string instruction_type = 5;
  // body is the operation-specific request, serialized.
  bytes body = 6;
}

// Signature is one signature over a payload, tagged with enough metadata for
// an agent to decide whether it can verify it at all.
message Signature {
  SignatureAlgorithm algorithm = 1;
  bytes value = 2;
  // key_id identifies which control-plane key signed this, so keys can be
  // rotated without a flag day.
  string key_id = 3;
}

// PublicKey is one published control-plane or agent key.
message PublicKey {
  SignatureAlgorithm algorithm = 1;
  bytes value = 2;
  string key_id = 3;
  google.protobuf.Timestamp not_before = 4;
  optional google.protobuf.Timestamp not_after = 5;
}

// VerificationPolicy states how many signatures must verify.
//
// It is delivered as configuration so a deployment can move from "accept the
// classic signature" through dual-signing to "require the post-quantum
// signature" without an agent release at each step.
message VerificationPolicy {
  // accepted_algorithms lists algorithms an agent may count toward the
  // threshold. An unrecognized algorithm is ignored, never trusted.
  repeated SignatureAlgorithm accepted_algorithms = 1;
  // require_all demands every accepted algorithm present in the envelope
  // verify. When false, one verifying signature from the accepted set is
  // sufficient.
  bool require_all = 2;
  // minimum_signatures is the count that must verify, applied after
  // require_all. Zero means one.
  uint32 minimum_signatures = 3;
}

// SignatureAlgorithm enumerates signature algorithms.
//
// Post-quantum signature standards are not settled: ML-DSA is specified but
// absent from the Go standard library, and FN-DSA is still a draft. The
// enumeration therefore reserves values for them now so that adding one later
// is a configuration change and a verifier update, not a protocol change.
enum SignatureAlgorithm {
  SIGNATURE_ALGORITHM_UNSPECIFIED = 0;
  // Ed25519, available in the Go standard library today.
  SIGNATURE_ALGORITHM_ED25519 = 1;
  // ECDSA over NIST P-256, for deployments constrained to FIPS primitives.
  SIGNATURE_ALGORITHM_ECDSA_P256 = 2;
  // ML-DSA-65 (FIPS 204). Reserved; requires a verifier that implements it.
  SIGNATURE_ALGORITHM_ML_DSA_65 = 3;
  // ML-DSA-87 (FIPS 204). Reserved.
  SIGNATURE_ALGORITHM_ML_DSA_87 = 4;
  // FN-DSA-512 (FIPS 206, draft). Reserved.
  SIGNATURE_ALGORITHM_FN_DSA_512 = 5;
}
