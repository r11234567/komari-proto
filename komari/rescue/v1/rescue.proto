syntax = "proto3";

package komari.rescue.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "komari/common/v1/common.proto";
import "komari/diag/v1/diag.proto";

option go_package = "github.com/r11234567/komari-proto/gen/go/komari/rescue/v1;rescuev1";

// RescueService owns the separately privileged, bounded rescue helper.
// It is independent from normal execution and WebSSH transports.
service RescueService {
  // GetRescueStatus returns the last helper state reported by one agent.
  rpc GetRescueStatus(GetRescueStatusRequest) returns (GetRescueStatusResponse);
  // CreateRescueSession authorizes one bounded rescue operation with fresh 2FA.
  rpc CreateRescueSession(CreateRescueSessionRequest) returns (CreateRescueSessionResponse);
  // WatchRescueSession streams state and bounded output until a terminal state.
  rpc WatchRescueSession(WatchRescueSessionRequest) returns (stream WatchRescueSessionResponse);
  // CancelRescueSession requests cancellation of an active rescue operation.
  rpc CancelRescueSession(CancelRescueSessionRequest) returns (CancelRescueSessionResponse);
  // LeaseRescueSessions lets the privileged helper receive assignments independently.
  rpc LeaseRescueSessions(LeaseRescueSessionsRequest) returns (stream LeaseRescueSessionsResponse);
  // ReportRescueEvent records sequenced helper output and terminal state.
  rpc ReportRescueEvent(ReportRescueEventRequest) returns (ReportRescueEventResponse);
  // ReportRescueStatus updates install, guardian and firewall state.
  rpc ReportRescueStatus(ReportRescueStatusRequest) returns (ReportRescueStatusResponse);
}

message GetRescueStatusRequest {
  string agent_id = 1;
}

message GetRescueStatusResponse {
  RescueHelperStatus status = 1;
}

message CreateRescueSessionRequest {
  string agent_id = 1;
  RescueAction action = 2;
  repeated string arguments = 3;
  google.protobuf.Duration timeout = 4;
  uint64 max_output_bytes = 5;
  string idempotency_key = 6;
  // two_factor is required for every action except the read-only performance
  // diagnostics. The server decides, fail-closed, which actions may omit it;
  // a client that sends it anyway is always accepted.
  komari.common.v1.TwoFactorProof two_factor = 7;
  // ssh_port applies only to RESCUE_ACTION_TEMPORARY_SSH_ACCESS and defaults
  // to 22. It travels as a typed field rather than through arguments, which
  // the helper rejects outright for every action.
  optional uint32 ssh_port = 8;
}

message CreateRescueSessionResponse {
  RescueSession session = 1;
}

message WatchRescueSessionRequest {
  string session_id = 1;
  uint64 after_sequence = 2;
}

message WatchRescueSessionResponse {
  RescueEvent event = 1;
  // session is emitted initially and whenever its business state changes.
  RescueSession session = 2;
}

message CancelRescueSessionRequest {
  string session_id = 1;
  string reason = 2;
  komari.common.v1.TwoFactorProof two_factor = 3;
}

message CancelRescueSessionResponse {
  RescueSession session = 1;
}

message LeaseRescueSessionsRequest {
  string agent_id = 1;
  string helper_instance_id = 2;
  string after_assignment_id = 3;
}

message LeaseRescueSessionsResponse {
  RescueAssignment assignment = 1;
}

message RescueAssignment {
  string assignment_id = 1;
  RescueSession session = 2;
  google.protobuf.Timestamp lease_expires_at = 3;
}

message ReportRescueEventRequest {
  string agent_id = 1;
  string helper_instance_id = 2;
  RescueEvent event = 3;
}

message ReportRescueEventResponse {
  uint64 accepted_sequence = 1;
}

message ReportRescueStatusRequest {
  string agent_id = 1;
  RescueHelperStatus status = 2;
}

message ReportRescueStatusResponse {
  bool accepted = 1;
}

message RescueHelperStatus {
  bool requested = 1;
  bool installed = 2;
  bool guardian_running = 3;
  bool helper_running = 4;
  bool firewall_configured = 5 [deprecated = true];
  string version = 6;
  string helper_instance_id = 7;
  optional komari.common.v1.ErrorDetail error = 8;
  google.protobuf.Timestamp observed_at = 9;
  NetworkIsolationMode network_isolation = 10;
  repeated string blocked_interfaces = 11;
}

message RescueSession {
  string session_id = 1;
  string agent_id = 2;
  RescueAction action = 3;
  repeated string arguments = 4;
  komari.common.v1.OperationState state = 5;
  google.protobuf.Timestamp created_at = 6;
  optional google.protobuf.Timestamp started_at = 7;
  optional google.protobuf.Timestamp finished_at = 8;
  uint64 output_bytes = 9;
  optional komari.common.v1.ErrorDetail error = 10;
  optional google.protobuf.Timestamp deadline_at = 11;
  // ssh_port is carried through to the helper for the temporary SSH actions.
  // It is validated by the server when the session is created, so the helper
  // receives a value it may act on rather than raw caller input.
  optional uint32 ssh_port = 12;
}

message RescueEvent {
  string session_id = 1;
  uint64 sequence = 2;
  google.protobuf.Timestamp occurred_at = 3;
  komari.common.v1.OperationState state = 4;
  RescueOutputStream stream = 5;
  bytes output = 6;
  optional komari.common.v1.ErrorDetail error = 7;
  // diagnostics is set instead of output for the performance diagnostic
  // actions, so a panel renders typed fields rather than parsing text.
  optional komari.diag.v1.DiagnosticsReport diagnostics = 8;
  // ssh_access is set by the temporary SSH actions and reports the state the
  // helper actually reached, including why it may be unreachable anyway.
  optional TemporarySSHAccess ssh_access = 9;
}

// TemporarySSHAccess reports one temporary public SSH exposure.
//
// The expiry is enforced locally by the host, never by the control plane: a
// nftables set element timeout where available, otherwise a systemd transient
// timer, with a persisted deadline reconciled by the helper on every lease so
// a helper restart cannot leave the port open.
message TemporarySSHAccess {
  uint32 port = 1;
  bool granted = 2;
  google.protobuf.Timestamp granted_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  ExpiryMechanism expiry_mechanism = 5;
  // sshd_state describes whether a daemon is actually reachable on this port.
  // Opening the firewall is not the same as being able to log in, and this is
  // the more common failure on a host whose public SSH was deliberately shut.
  SSHDaemonState sshd_state = 6;
}

// SSHDaemonState is the pre-flight check performed before the firewall changes.
message SSHDaemonState {
  bool running = 1;
  // listen_addresses is what sshd is configured to bind, which on a
  // Tailscale-only host is frequently a private address only.
  repeated string listen_addresses = 2;
  // observed_listen_ports is what is actually bound, read from the kernel.
  repeated uint32 observed_listen_ports = 3;
  // reachable is false when nothing is listening on the requested port, in
  // which case opening the firewall cannot make a login succeed.
  bool reachable = 4;
  string limitation = 5;
}

// ExpiryMechanism records which local mechanism will close the window, so an
// operator can tell a kernel-enforced expiry from a best-effort one.
enum ExpiryMechanism {
  EXPIRY_MECHANISM_UNSPECIFIED = 0;
  // Kernel-enforced nftables set element timeout. Survives helper restarts.
  EXPIRY_MECHANISM_NFTABLES_TIMEOUT = 1;
  // systemd transient timer unit. Survives helper restarts.
  EXPIRY_MECHANISM_SYSTEMD_TIMER = 2;
  // Helper reconciliation against a persisted deadline only. Always armed as
  // a backstop, and the sole mechanism when neither of the above exists.
  EXPIRY_MECHANISM_HELPER_RECONCILE = 3;
}

// RescueAction is deliberately bounded; the helper never exposes an arbitrary shell.
enum RescueAction {
  RESCUE_ACTION_UNSPECIFIED = 0;
  RESCUE_ACTION_DIAGNOSTICS = 1;
  RESCUE_ACTION_VERIFY_INSTALLATION = 2 [deprecated = true];
  RESCUE_ACTION_RESTORE_LAST_CONFIG = 3 [deprecated = true];
  RESCUE_ACTION_ROLLBACK_RUNTIME_SNAPSHOT = 4 [deprecated = true];
  RESCUE_ACTION_REPAIR_FIREWALL = 5 [deprecated = true];
  RESCUE_ACTION_RESTART_AGENT = 6 [deprecated = true];
  RESCUE_ACTION_SHUTDOWN = 7;
  RESCUE_ACTION_REBOOT = 8;
  RESCUE_ACTION_BLOCK_PUBLIC_INTERFACES = 9;
  RESCUE_ACTION_BLOCK_TAILSCALE_INTERFACES = 10;
  RESCUE_ACTION_ISOLATE_CONTROL_PLANE = 11;
  RESCUE_ACTION_RESTORE_NETWORK = 12;
  RESCUE_ACTION_ROLLBACK_ONLINE_CONFIG = 13;
  // Read-only performance diagnostics. These are the only actions the server
  // may accept without a fresh two-factor proof, and they never require a
  // privileged helper.
  RESCUE_ACTION_DETAILED_CPU_METRICS = 14;
  RESCUE_ACTION_DETAILED_MEMORY_METRICS = 15;
  // Temporary public SSH exposure, which expires without any further
  // instruction from the control plane.
  RESCUE_ACTION_TEMPORARY_SSH_ACCESS = 16;
  RESCUE_ACTION_REVOKE_TEMPORARY_SSH_ACCESS = 17;
  // Withdraw the active privileged configuration locally.
  //
  // This exists because a privilege change has to be undoable from the host
  // without the control plane's cooperation. If the only way back were a
  // panel instruction, then a panel that is unreachable, or that was itself
  // the source of a bad change, would leave the host stuck with widened
  // privileges. The agent reports the rollback afterwards; the report is a
  // notification, not a request for permission.
  RESCUE_ACTION_ROLLBACK_PRIVILEGED_CONFIG = 18;
}

enum NetworkIsolationMode {
  NETWORK_ISOLATION_MODE_UNSPECIFIED = 0;
  NETWORK_ISOLATION_MODE_NONE = 1;
  NETWORK_ISOLATION_MODE_PUBLIC_INTERFACES = 2;
  NETWORK_ISOLATION_MODE_TAILSCALE_INTERFACES = 3;
  NETWORK_ISOLATION_MODE_CONTROL_PLANE_ONLY = 4;
}

enum RescueOutputStream {
  RESCUE_OUTPUT_STREAM_UNSPECIFIED = 0;
  RESCUE_OUTPUT_STREAM_STDOUT = 1;
  RESCUE_OUTPUT_STREAM_STDERR = 2;
}
