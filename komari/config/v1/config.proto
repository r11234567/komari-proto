syntax = "proto3";

package komari.config.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "komari/common/v1/common.proto";
import "komari/report/v1/report.proto";
import "komari/security/v1/security.proto";

option go_package = "github.com/r11234567/komari-proto/gen/go/komari/config/v1;configv1";

// ConfigService owns desired runtime configuration and revision acknowledgements.
service ConfigService {
  // GetDesiredConfig returns immediately and is suitable for reconnect recovery.
  rpc GetDesiredConfig(GetDesiredConfigRequest) returns (GetDesiredConfigResponse);
  // WatchDesiredConfig streams only configuration revisions.
  rpc WatchDesiredConfig(WatchDesiredConfigRequest) returns (stream WatchDesiredConfigResponse);
  // AcknowledgeConfig records applied or rejected as a business-level terminal state.
  rpc AcknowledgeConfig(AcknowledgeConfigRequest) returns (AcknowledgeConfigResponse);
  // UpdateDesiredConfig stores a new revision for one agent.
  rpc UpdateDesiredConfig(UpdateDesiredConfigRequest) returns (UpdateDesiredConfigResponse);
}

// PrivilegedDeliveryService owns the separate delivery track for settings a
// running agent never applies on its own.
//
// It is deliberately a second track rather than an extension of ConfigService.
// The ordinary track is a convergence loop: the panel names a desired state
// and the agent reaches it unattended. These settings cannot work that way,
// because adopting one widens what the agent is permitted to do, and an agent
// that could grant itself more privilege on the panel's word alone would make
// the panel a single point from which every host can be escalated. So this
// track carries an explicit human decision, and the ordinary track keeps its
// existing behaviour untouched.
service PrivilegedDeliveryService {
  // GetPrivilegedDelivery returns the current privileged revision and its
  // state. Suitable for reconnect recovery.
  rpc GetPrivilegedDelivery(GetPrivilegedDeliveryRequest) returns (GetPrivilegedDeliveryResponse);
  // WatchPrivilegedDelivery streams privileged revisions and state changes.
  rpc WatchPrivilegedDelivery(WatchPrivilegedDeliveryRequest) returns (stream WatchPrivilegedDeliveryResponse);
  // UpdatePrivilegedDelivery stores a new privileged revision, computing the
  // upgrade class from the agent's reported privilege mode.
  rpc UpdatePrivilegedDelivery(UpdatePrivilegedDeliveryRequest) returns (UpdatePrivilegedDeliveryResponse);
  // ConfirmPrivilegedDelivery records the operator's second confirmation in
  // the panel. It never applies anything by itself: for a revision that
  // crosses a privilege boundary it only authorizes the host-side upgrade.
  rpc ConfirmPrivilegedDelivery(ConfirmPrivilegedDeliveryRequest) returns (ConfirmPrivilegedDeliveryResponse);
  // ReportPrivilegedDelivery is how the agent, or the upgrade script running
  // on the host, reports the outcome including a local rollback.
  rpc ReportPrivilegedDelivery(ReportPrivilegedDeliveryRequest) returns (ReportPrivilegedDeliveryResponse);
  // CompleteManualUpgrade is called by the host-side upgrade script with the
  // task nonce. It is the only way a privileged revision becomes active, and
  // it proves the operator ran the upgrade on the machine itself.
  rpc CompleteManualUpgrade(CompleteManualUpgradeRequest) returns (CompleteManualUpgradeResponse);
  // ListPrivilegedRevisions returns a machine's privileged history and which
  // revision it is actually running, for the panel.
  rpc ListPrivilegedRevisions(ListPrivilegedRevisionsRequest) returns (ListPrivilegedRevisionsResponse);
}

message ListPrivilegedRevisionsRequest {
  string agent_id = 1;
  // limit bounds the history returned; zero means a server default.
  uint32 limit = 2;
}

message ListPrivilegedRevisionsResponse {
  // revisions are newest first.
  repeated PrivilegedRevision revisions = 1;
  // applied_revision is the newest revision the host reported as delivered,
  // which is what the machine is running, as opposed to the newest one saved.
  uint64 applied_revision = 2;
  // installed_privilege_mode is what the agent service is installed as, which
  // decides whether a widening change can be confirmed in the panel or has to
  // be upgraded on the host.
  komari.report.v1.PrivilegeMode installed_privilege_mode = 3;
}

message GetPrivilegedDeliveryRequest {
  string agent_id = 1;
  uint64 applied_revision = 2;
}

message GetPrivilegedDeliveryResponse {
  optional PrivilegedRevision revision = 1;
}

message WatchPrivilegedDeliveryRequest {
  string agent_id = 1;
  uint64 after_revision = 2;
}

message WatchPrivilegedDeliveryResponse {
  PrivilegedRevision revision = 1;
}

message UpdatePrivilegedDeliveryRequest {
  string agent_id = 1;
  PrivilegedConfig privileged = 2;
  uint64 expected_revision = 3;
  string reason = 4;
}

message UpdatePrivilegedDeliveryResponse {
  PrivilegedRevision revision = 1;
}

message ConfirmPrivilegedDeliveryRequest {
  string agent_id = 1;
  uint64 revision = 2;
  // two_factor is required: confirming here is what authorizes a privilege
  // change on the host.
  komari.common.v1.TwoFactorProof two_factor = 3;
}

message ConfirmPrivilegedDeliveryResponse {
  PrivilegedRevision revision = 1;
}

message ReportPrivilegedDeliveryRequest {
  string agent_id = 1;
  uint64 revision = 2;
  PrivilegedDeliveryState state = 3;
  repeated komari.common.v1.ErrorDetail errors = 4;
  google.protobuf.Timestamp finished_at = 5;
  // active_privilege_mode is what the agent actually holds after the
  // transition, which the panel checks against what the revision assumed
  // rather than trusting the reported state alone.
  komari.report.v1.PrivilegeMode active_privilege_mode = 6;
}

message ReportPrivilegedDeliveryResponse {
  bool accepted = 1;
  PrivilegedRevision revision = 2;
}

message CompleteManualUpgradeRequest {
  string agent_id = 1;
  // nonce is the single-use value issued with the ManualUpgradeTask.
  string nonce = 2;
  // local_authentication names how the operator was verified on the host, for
  // the audit trail. The credential itself never leaves the machine.
  string local_authentication = 3;
  // operator is the host account that ran the upgrade.
  string operator = 4;
  komari.report.v1.PrivilegeMode resulting_privilege_mode = 5;
}

message CompleteManualUpgradeResponse {
  bool accepted = 1;
  PrivilegedRevision revision = 2;
}

// PrivilegedRevision is one immutable privileged desired snapshot plus the
// state of the human decision attached to it.
message PrivilegedRevision {
  string agent_id = 1;
  uint64 revision = 2;
  PrivilegedConfig privileged = 3;
  UpgradePlan plan = 4;
  PrivilegedDeliveryState state = 5;
  google.protobuf.Timestamp saved_at = 6;
  optional google.protobuf.Timestamp confirmed_at = 7;
  optional google.protobuf.Timestamp finished_at = 8;
  repeated komari.common.v1.ErrorDetail errors = 9;
  // previous_revision is what a rollback returns to, so a panel can show what
  // rolling back would mean before it happens.
  optional uint64 previous_revision = 10;
  // signature authenticates this revision end to end.
  //
  // TLS cannot establish it: the connection commonly terminates at a reverse
  // proxy or access gateway that sees plaintext, so anything past that point
  // could compose a revision widening what the agent may do. The envelope
  // carries a SignedInstruction whose agent_id, nonce and expiry are inside
  // the signature, which is what stops a captured revision from being replayed
  // against another host or at another time.
  //
  // It is optional only so an agent can report a missing signature as a
  // refusal rather than failing to parse. An agent that has pinned keys must
  // never act on a revision without one.
  optional komari.security.v1.SignedEnvelope signature = 11;
}

// PrivilegedDeliveryState is the state of one privileged revision.
//
// These are business states of a human decision, not transport states, which
// is why they are separate from DeliveryState: "sent" is meaningless for a
// change that a machine is never allowed to adopt by itself.
enum PrivilegedDeliveryState {
  PRIVILEGED_DELIVERY_STATE_UNSPECIFIED = 0;
  // Saved, and waiting for an operator to confirm in the panel. This is the
  // resting state of a change within one privilege level.
  PRIVILEGED_DELIVERY_STATE_NEEDS_CONFIRMATION = 1;
  // Confirmed in the panel, but it crosses a privilege boundary, so it now
  // waits for the operator to run the upgrade on the host and authenticate
  // there. The panel cannot advance this state on its own.
  PRIVILEGED_DELIVERY_STATE_NEEDS_MANUAL_AUTHORIZATION = 2;
  // Active on the agent.
  PRIVILEGED_DELIVERY_STATE_DELIVERED = 3;
  // Withdrawn after being active. A rollback may be initiated from the panel
  // or locally on the host, since the host must be able to undo a privilege
  // change without the panel's cooperation.
  PRIVILEGED_DELIVERY_STATE_ROLLED_BACK = 4;
  // The transition was attempted and failed; errors carries why.
  PRIVILEGED_DELIVERY_STATE_FAILED = 5;
}

// RuntimeConfig contains settings that can be atomically applied without reinstalling.
message RuntimeConfig {
  optional bool memory_include_cache = 1;
  // Deprecated: GPU enablement requires reinstalling the Agent.
  optional bool enable_gpu = 2 [deprecated = true];
  optional bool detailed_gpu = 3;
  repeated string include_nics = 4;
  repeated string exclude_nics = 5;
  repeated string include_mountpoints = 6;
  optional google.protobuf.Duration report_interval = 7;
  optional uint32 traffic_reset_day = 8;
  // Deprecated: remote-control enablement requires reinstalling the Agent.
  optional bool remote_control_enabled = 9 [deprecated = true];

  // Fields below complete the delivery surface: every agent setting that a
  // running agent can adopt is deliverable, so an operator never edits a
  // config file by hand to change something the panel already knows.
  //
  // Deliverability is not the same as automatic application. Settings that a
  // running agent cannot adopt, or that would widen what the agent is allowed
  // to do, are classified separately in UpgradePlan below and are never
  // applied by the agent on its own.
  optional bool memory_report_raw_used = 10;
  optional string custom_dns = 11;
  // prefer_ip_version is "4", "6" or empty for no preference.
  optional string prefer_ip_version = 12;
  optional google.protobuf.Duration info_report_interval = 13;
  optional uint32 max_retries = 14;
  optional google.protobuf.Duration reconnect_interval = 15;
  optional bool disable_compression = 16;
  optional string custom_ipv4 = 17;
  optional string custom_ipv6 = 18;
  optional bool get_ip_addr_from_nic = 19;
  optional bool disable_auto_update = 20;
  // ignore_unsafe_cert weakens transport verification. It is deliverable so a
  // misconfigured fleet can be repaired centrally, but it is classified as a
  // confirmed change rather than an automatic one.
  optional bool ignore_unsafe_cert = 21;
}

// PrivilegedConfig holds settings whose adoption changes what the agent is
// permitted to do, rather than how it observes the host.
//
// These are delivered in the same revision as RuntimeConfig but are never
// self-applied. Remote control executes commands with the agent's own process
// identity, so enabling it on a non-privileged agent is a privilege change and
// is gated behind an out-of-band, human-performed upgrade.
message PrivilegedConfig {
  optional bool remote_control_enabled = 1;
  optional bool webssh_enabled = 2;
  optional bool execution_enabled = 3;
  optional bool enable_gpu = 4;
  // rescue_helper_enabled controls whether the separately privileged rescue
  // helper may be installed and leased.
  optional bool rescue_helper_enabled = 5;
  // required_privilege_mode is the privilege level these settings assume. When
  // it exceeds what the agent currently holds, the revision produces a manual
  // upgrade task instead of being applied.
  komari.report.v1.PrivilegeMode required_privilege_mode = 6;
}

// UpgradePlan states how one delivered revision may be adopted.
//
// The classification is computed by the control plane from the revision's
// content and the agent's reported privilege mode, and is delivered with the
// revision so the agent and the panel agree on what is permitted without
// either re-deriving it.
message UpgradePlan {
  UpgradeClass upgrade_class = 1;
  // reasons explains, in operator-facing terms, why this is not automatic.
  repeated string reasons = 2;
  // from_privilege_mode and to_privilege_mode are set when the plan crosses a
  // privilege boundary.
  komari.report.v1.PrivilegeMode from_privilege_mode = 3;
  komari.report.v1.PrivilegeMode to_privilege_mode = 4;
  // manual_task is set for classes that require action outside the agent.
  optional ManualUpgradeTask manual_task = 5;
}

// ManualUpgradeTask is an upgrade a human must perform on the host itself.
//
// The control plane never collects a host credential. The operator runs the
// command on the machine, in their own session, and the local sudo or PAM
// stack collects and verifies the password there. The panel learns only that
// the upgrade succeeded.
message ManualUpgradeTask {
  string task_id = 1;
  // nonce is single-use and ties the completion report back to this task.
  string nonce = 2;
  // command is what the operator runs on the host.
  string command = 3;
  google.protobuf.Timestamp expires_at = 4;
  // require_local_password demands the upgrade script verify the invoking
  // user's password even when sudo is configured NOPASSWD, so that a passwordless
  // sudo rule alone cannot silently widen the agent's privileges.
  bool require_local_password = 5;
  // audit_facility names the local log facility the script must write to, so
  // the privilege change is recorded on the host independently of the panel.
  string audit_facility = 6;
}

// UpgradeClass classifies how a delivered revision may be adopted.
enum UpgradeClass {
  UPGRADE_CLASS_UNSPECIFIED = 0;
  // The running agent can adopt this revision atomically. No human involved.
  UPGRADE_CLASS_AUTOMATIC = 1;
  // Adoption is safe but not self-applied: it needs an explicit confirmation
  // in the panel. This covers a restart within the same privilege level.
  UPGRADE_CLASS_MANUAL_CONFIRM = 2;
  // Adoption crosses a privilege boundary, such as a non-privileged agent
  // gaining remote control or being reinstalled as a privileged service. The
  // operator must run the upgrade on the host and authenticate locally.
  UPGRADE_CLASS_MANUAL_PRIVILEGED = 3;
}

// DesiredConfig is an immutable desired runtime snapshot.
message DesiredConfig {
  string agent_id = 1;
  uint64 revision = 2;
  RuntimeConfig runtime = 3;
  google.protobuf.Timestamp saved_at = 4;
  string minimum_agent_version = 5;
  // privileged carries settings the agent never self-applies.
  optional PrivilegedConfig privileged = 6;
  // plan states how this revision may be adopted. An agent that receives a
  // revision whose plan is not AUTOMATIC acknowledges it as requiring an
  // upgrade rather than applying it.
  optional UpgradePlan plan = 7;
}

// GetDesiredConfigRequest asks for a revision newer than the currently applied one.
message GetDesiredConfigRequest {
  string agent_id = 1;
  uint64 applied_revision = 2;
}

// GetDesiredConfigResponse contains the current desired snapshot when it differs.
message GetDesiredConfigResponse {
  optional DesiredConfig desired = 1;
  komari.common.v1.DeliveryState delivery_state = 2;
}

// WatchDesiredConfigRequest subscribes after a known revision.
message WatchDesiredConfigRequest {
  string agent_id = 1;
  uint64 after_revision = 2;
}

// WatchDesiredConfigResponse wraps one immutable desired revision.
message WatchDesiredConfigResponse {
  DesiredConfig desired = 1;
}

// AcknowledgeConfigRequest reports the atomic apply result.
message AcknowledgeConfigRequest {
  string agent_id = 1;
  uint64 revision = 2;
  ConfigApplyStatus status = 3;
  repeated komari.common.v1.ErrorDetail errors = 4;
  google.protobuf.Timestamp finished_at = 5;
}

// AcknowledgeConfigResponse returns the canonical delivery state.
message AcknowledgeConfigResponse {
  bool accepted = 1;
  komari.common.v1.DeliveryState delivery_state = 2;
}

// UpdateDesiredConfigRequest creates a revision using optimistic concurrency.
message UpdateDesiredConfigRequest {
  string agent_id = 1;
  RuntimeConfig runtime = 2;
  uint64 expected_revision = 3;
  string reason = 4;
  // force_dispatch creates a new revision even if runtime is byte-for-byte unchanged.
  bool force_dispatch = 5;
}

// UpdateDesiredConfigResponse contains the stored immutable snapshot.
message UpdateDesiredConfigResponse {
  DesiredConfig desired = 1;
  komari.common.v1.DeliveryState delivery_state = 2;
}

// ConfigApplyStatus is the agent's terminal apply result.
enum ConfigApplyStatus {
  CONFIG_APPLY_STATUS_UNSPECIFIED = 0;
  CONFIG_APPLY_STATUS_APPLIED = 1;
  CONFIG_APPLY_STATUS_REJECTED = 2;
  CONFIG_APPLY_STATUS_UPGRADE_REQUIRED = 3;
}
