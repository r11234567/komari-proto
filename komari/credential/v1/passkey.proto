syntax = "proto3";

package komari.credential.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/r11234567/komari-proto/gen/go/komari/credential/v1;credentialv1";

// Pre-session ceremonies are bound to a short-lived HttpOnly cookie. Only
// completion may issue the normal browser session cookie.
service PasskeyLoginService {
  rpc GetPasskeyStatus(GetPasskeyStatusRequest) returns (GetPasskeyStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc BeginPasskeyLogin(BeginPasskeyLoginRequest) returns (BeginPasskeyLoginResponse);
  rpc CompletePasskeyLogin(CompletePasskeyLoginRequest) returns (CompletePasskeyLoginResponse);
}

// All operations require an interactive session and fresh authorization.
// Completing registration consumes the authorized, session-bound ceremony.
service PasskeyManagementService {
  rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse);
  rpc BeginPasskeyRegistration(BeginPasskeyRegistrationRequest) returns (BeginPasskeyRegistrationResponse);
  rpc CompletePasskeyRegistration(CompletePasskeyRegistrationRequest) returns (CompletePasskeyRegistrationResponse);
  rpc DeletePasskey(DeletePasskeyRequest) returns (DeletePasskeyResponse);
}

message GetPasskeyStatusRequest {}

message GetPasskeyStatusResponse {
  // Site configuration only, independent of credential or account counts.
  bool enabled = 1;
}

message BeginPasskeyLoginRequest {
  // Empty selects discoverable credentials. Older credentials can use an account hint.
  string username = 1;
}

message BeginPasskeyLoginResponse {
  google.protobuf.Struct options = 1;
}

message CompletePasskeyLoginRequest {
  google.protobuf.Struct assertion = 1;
}

message CompletePasskeyLoginResponse {
  bool authenticated = 1;
}

message PasskeySummary {
  string credential_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
}

message ListPasskeysRequest {
  string authorization_token = 1;
}

message ListPasskeysResponse {
  repeated PasskeySummary passkeys = 1;
}

message BeginPasskeyRegistrationRequest {
  string display_name = 1;
  // Password bootstrap is accepted only for a session without an enrolled factor.
  oneof verification {
    string authorization_token = 2;
    string password = 3;
  }
}

message BeginPasskeyRegistrationResponse {
  string challenge_id = 1;
  google.protobuf.Struct options = 2;
}

message CompletePasskeyRegistrationRequest {
  string challenge_id = 1;
  google.protobuf.Struct attestation = 2;
}

message CompletePasskeyRegistrationResponse {
  PasskeySummary passkey = 1;
}

message DeletePasskeyRequest {
  string credential_id = 1;
  string authorization_token = 2;
}

message DeletePasskeyResponse {}
