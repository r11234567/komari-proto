syntax = "proto3";

package komari.credential.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/r11234567/komari-proto/gen/go/komari/credential/v1;credentialv1";

// TrustedCredentialService routes interactive verification through trusted providers.
// Registering providers and consuming authorizations are server-only operations.
service TrustedCredentialService {
  rpc ListTrustedCredentialProviders(ListTrustedCredentialProvidersRequest) returns (ListTrustedCredentialProvidersResponse);
  rpc BeginVerification(BeginVerificationRequest) returns (BeginVerificationResponse);
  rpc CompleteVerification(CompleteVerificationRequest) returns (CompleteVerificationResponse);
  rpc CancelVerification(CancelVerificationRequest) returns (CancelVerificationResponse);
  rpc GetCredentialContacts(GetCredentialContactsRequest) returns (GetCredentialContactsResponse);
  rpc BeginContactBinding(BeginContactBindingRequest) returns (BeginContactBindingResponse);
  rpc SaveCredentialContact(SaveCredentialContactRequest) returns (SaveCredentialContactResponse);
  rpc DeleteCredentialContact(DeleteCredentialContactRequest) returns (DeleteCredentialContactResponse);
}

// PasswordLoginService isolates password-confirmed preauthentication from live
// user sessions. Its short-lived HttpOnly cookie cannot authorize admin RPCs.
service PasswordLoginService {
  rpc BeginPasswordLogin(BeginPasswordLoginRequest) returns (BeginPasswordLoginResponse);
  rpc BeginLoginVerification(BeginLoginVerificationRequest) returns (BeginVerificationResponse);
  rpc CompletePasswordLogin(CompleteVerificationRequest) returns (CompletePasswordLoginResponse);
  rpc CancelPasswordLogin(CancelPasswordLoginRequest) returns (CancelPasswordLoginResponse);
}

// CredentialPurpose prevents a proof for one operation authorizing another.
enum CredentialPurpose {
  CREDENTIAL_PURPOSE_UNSPECIFIED = 0;
  CREDENTIAL_PURPOSE_BIND_CONTACT = 1;
  CREDENTIAL_PURPOSE_MANAGE_CREDENTIALS = 2;
  CREDENTIAL_PURPOSE_UNLOCK_WORKSPACE = 3;
  CREDENTIAL_PURPOSE_LOGIN_SETTINGS = 4;
  CREDENTIAL_PURPOSE_SENSITIVE_OPERATION = 5;
  CREDENTIAL_PURPOSE_PASSWORD_LOGIN = 6;
}

// CredentialProviderKind describes a trusted verifier, not an alert route.
enum CredentialProviderKind {
  CREDENTIAL_PROVIDER_KIND_UNSPECIFIED = 0;
  CREDENTIAL_PROVIDER_KIND_LEGACY_TOTP = 1;
  CREDENTIAL_PROVIDER_KIND_EMAIL_OTP = 2;
  CREDENTIAL_PROVIDER_KIND_TELEGRAM_OTP = 3;
  CREDENTIAL_PROVIDER_KIND_PLUGIN = 4;
}

// TrustedCredentialProvider contains public metadata only.
message TrustedCredentialProvider {
  string id = 1;
  string display_name = 2;
  CredentialProviderKind kind = 3;
  repeated CredentialPurpose purposes = 4;
}

message ListTrustedCredentialProvidersRequest {
  CredentialPurpose purpose = 1;
}

message ListTrustedCredentialProvidersResponse {
  repeated TrustedCredentialProvider providers = 1;
}

message BeginVerificationRequest {
  string provider_id = 1;
  CredentialPurpose purpose = 2;
  // The action consumer compares this with its authoritative operation target.
  string resource = 3;
  // Provider-specific input is validated by the registered server adapter.
  google.protobuf.Struct parameters = 4;
}

message BeginVerificationResponse {
  string challenge_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  string prompt_type = 3;
  // Public UI data only; never provider secrets or the expected OTP.
  google.protobuf.Struct prompt = 4;
}

message CompleteVerificationRequest {
  string challenge_id = 1;
  // Sensitive verification input must not appear in URLs or diagnostic logs.
  google.protobuf.Struct proof = 2;
}

message CompleteVerificationResponse {
  CredentialAuthorization authorization = 1;
}

// CredentialAuthorization is a short-lived, single-use capability. It does not
// create a login session or implicitly unlock any other security scope.
message CredentialAuthorization {
  string grant_token = 1;
  string provider_id = 2;
  CredentialPurpose purpose = 3;
  string resource = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message CancelVerificationRequest {
  string challenge_id = 1;
}

message CancelVerificationResponse {
  bool cancelled = 1;
}

// Contact addresses are masked in read responses. Only verified private user
// contacts are usable for OTP; alert/group recipients are never imported.
message CredentialContact {
  string kind = 1;
  string masked_address = 2;
  string transport = 3;
  google.protobuf.Timestamp verified_at = 4;
}

// CredentialTransport contains capability metadata, never sender credentials.
message CredentialTransport {
  string id = 1;
  repeated string kinds = 2;
}

message GetCredentialContactsRequest {}

message GetCredentialContactsResponse {
  repeated CredentialContact contacts = 1;
  repeated CredentialTransport transports = 2;
  bool password_bootstrap_allowed = 3;
}

message BeginContactBindingRequest {
  string kind = 1;
  string address = 2;
  string transport = 3;
  // A ManageCredentials authorization bound to the canonical new contact.
  string authorization_token = 4;
  // Used only for initial enrollment when no second factor is configured.
  string password = 5;
}

message BeginContactBindingResponse {
  string challenge_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  string prompt_type = 3;
  google.protobuf.Struct prompt = 4;
}

// CompleteVerification supplies the new destination's OTP and yields the
// BindContact authorization consumed here. The target must exactly match.
message SaveCredentialContactRequest {
  string kind = 1;
  string address = 2;
  string transport = 3;
  string grant_token = 4;
}

message SaveCredentialContactResponse {
  CredentialContact contact = 1;
}

message DeleteCredentialContactRequest {
  string kind = 1;
  string grant_token = 2;
}

message DeleteCredentialContactResponse {
  bool deleted = 1;
}

message BeginPasswordLoginRequest {
  string username = 1;
  string password = 2;
}

message BeginPasswordLoginResponse {
  // True only after a real session has been created. Existing installations
  // without any configured second factor retain password-only compatibility.
  bool authenticated = 1;
  repeated TrustedCredentialProvider providers = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message BeginLoginVerificationRequest {
  string provider_id = 1;
}

message CompletePasswordLoginResponse {
  bool authenticated = 1;
}

message CancelPasswordLoginRequest {}

message CancelPasswordLoginResponse {
  bool cancelled = 1;
}
