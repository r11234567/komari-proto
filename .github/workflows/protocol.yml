name: Protocol
on:
  pull_request:
  push:
    branches: [main, 'fix/privileged-delivery-v2']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.57.0'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format, lint, breaking and generated client consistency
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'v0.1.37' }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          buf format --diff --exit-code 2>&1 | tee ci-artifacts/format.log
          buf lint 2>&1 | tee ci-artifacts/lint.log
          buf breaking --against ".git#ref=${BASE_SHA}" 2>&1 | tee ci-artifacts/breaking.log
          buf generate 2>&1 | tee ci-artifacts/generate.log
          git diff --exit-code -- gen 2>&1 | tee ci-artifacts/generated-diff.log
      - name: Go protocol compatibility tests
        if: success() || failure()
        run: scripts/ci/run-go-tests.sh ./...
      - name: TypeScript clients and hash vectors
        if: success() || failure()
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          npm install --ignore-scripts --no-save --package-lock=false typescript@5.8.3 @bufbuild/protobuf@2.10.0 2>&1 | tee ci-artifacts/npm-install.log
          npx tsc --noEmit --module nodenext --target es2022 --skipLibCheck $(find gen/ts -name '*.ts') 2>&1 | tee ci-artifacts/typescript.log
          node --test tests/privileged-hash.test.mjs 2>&1 | tee ci-artifacts/hash-ts.log
          npm pack --dry-run 2>&1 | tee ci-artifacts/npm-pack.log
      - name: Package generated clients even on failure
        if: always()
        run: |
          mkdir -p ci-artifacts
          tar -czf ci-artifacts/generated-clients.tar.gz gen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
