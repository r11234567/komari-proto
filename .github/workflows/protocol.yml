name: CI
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the pinned Buf version
        id: buf
        run: printf 'version=%s\n' "$(cat .buf-version)" >> "$GITHUB_OUTPUT"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ steps.buf.outputs.version }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Format, lint, breaking and generated client consistency
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/check-contracts.sh "$BASE_SHA"
      - name: Go protocol compatibility tests
        if: success() || failure()
        run: scripts/ci/run-go-tests.sh ./...
      - name: Package generated clients even on failure
        if: always()
        run: |
          mkdir -p ci-artifacts
          tar -czf ci-artifacts/generated-clients.tar.gz gen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
    name: Contracts, generation and Go
  typescript:
    name: TypeScript / Node ${{ matrix.node || '24 (pinned)' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['', '22.22.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          node-version-file: .node-version
          cache: npm
      - name: Set up the repository npm version
        run: npm install --global "npm@$(cat .npm-version)"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
