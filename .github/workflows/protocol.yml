name: CI
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.57.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format, lint, breaking and generated client consistency
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Reviewed main baseline after the Phase 3C transition.
          PROTOCOL_BASELINE: d89e88d8ae3e416563e4345fd653a10f67d89053
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          buf format --diff --exit-code 2>&1 | tee ci-artifacts/format.log
          buf lint 2>&1 | tee ci-artifacts/lint.log
          buf breaking --against ".git#ref=${PROTOCOL_BASELINE}" 2>&1 | tee ci-artifacts/breaking.log
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 && "$BASE_SHA" != "$PROTOCOL_BASELINE" ]]; then
            buf breaking --against ".git#ref=${BASE_SHA}" 2>&1 | tee -a ci-artifacts/breaking.log
          fi
          buf generate 2>&1 | tee ci-artifacts/generate.log
          git add --intent-to-add -- gen
          git diff --exit-code -- gen 2>&1 | tee ci-artifacts/generated-diff.log
      - name: Go protocol compatibility tests
        if: success() || failure()
        run: scripts/ci/run-go-tests.sh ./...
      - name: TypeScript clients and hash vectors
        if: success() || failure()
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          npm install --ignore-scripts --no-save --package-lock=false typescript@5.8.3 @bufbuild/protobuf@2.10.0 2>&1 | tee ci-artifacts/npm-install.log
          npx tsc --noEmit --module esnext --moduleResolution bundler --target es2022 --skipLibCheck $(find gen/ts -name '*.ts') 2>&1 | tee ci-artifacts/typescript.log
          node --test tests/privileged-hash.test.mjs 2>&1 | tee ci-artifacts/hash-ts.log
          npm pack --dry-run 2>&1 | tee ci-artifacts/npm-pack.log
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify generated clients and hash vectors on Node 24
        run: |-
          set -euo pipefail
          mapfile -d '' -t sources < <(find gen/ts -name '*.ts' -print0)
          (( ${#sources[@]} > 0 ))
          node node_modules/typescript/bin/tsc --noEmit --module esnext --moduleResolution bundler --target es2022 --skipLibCheck "${sources[@]}"
          node --test tests/privileged-hash.test.mjs
          npm pack --dry-run
      - name: Package generated clients even on failure
        if: always()
        run: |
          mkdir -p ci-artifacts
          tar -czf ci-artifacts/generated-clients.tar.gz gen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
    name: Contracts, Go and TypeScript
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
